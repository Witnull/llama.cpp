name: Build llama.cpp (CUDA 12.4)

on:
  workflow_dispatch:
    inputs:
      llama_ref:
        description: "llama.cpp branch, tag, or commit SHA"
        required: false
        default: "master"
        type: string

permissions:
  contents: read

jobs:
  # ==========================================================
  # Windows x64 CUDA 12.4
  # ==========================================================
  windows-cuda:
    name: Windows x64 CUDA 12.4
    runs-on: windows-2022

    steps:
      - name: Checkout llama.cpp
        uses: actions/checkout@v6
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ inputs.llama_ref || 'master' }}
          path: llama.cpp
          fetch-depth: 1

      - name: Record llama.cpp commit
        shell: pwsh
        env:
          LLAMA_REF_INPUT: ${{ inputs.llama_ref || 'master' }}
        run: |
          $commit = (git -C llama.cpp rev-parse HEAD).Trim()
          @(
            "LLAMA_COMMIT=$commit"
            "LLAMA_REF=$env:LLAMA_REF_INPUT"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "llama.cpp ref: $env:LLAMA_REF_INPUT"
          Write-Host "llama.cpp commit: $commit"

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CUDA 12.4
        uses: ./llama.cpp/.github/actions/windows-setup-cuda
        with:
          cuda_version: "12.4"
          cuda_arch: "x64"

      - name: Install Ninja and 7zip
        shell: pwsh
        run: choco install ninja 7zip -y --no-progress

      - name: Verify build environment
        shell: pwsh
        run: |
          Get-Command cl.exe | Format-List Source
          cmake --version
          ninja --version
          nvcc --version
          Write-Host "CUDA_PATH=$env:CUDA_PATH"

      - name: Configure CMake
        shell: pwsh
        run: |
          # Note: All arguments containing dots (.) or semicolons (;) MUST be single-quoted
          # in pwsh so PowerShell does not split v3.4.3 into 'v3' and '.4.3'.
          # lightning-indexer instantiates half dequantizers; FP16_AVAILABLE starts at sm_60.
          cmake `
            -S llama.cpp `
            -B build `
            -G "Ninja Multi-Config" `
            '-DBUILD_SHARED_LIBS=ON' `
            '-DGGML_BACKEND_DL=ON' `
            '-DGGML_NATIVE=OFF' `
            '-DGGML_CPU=ON' `
            '-DGGML_CPU_ALL_VARIANTS=ON' `
            '-DGGML_CUDA=ON' `
            '-DCMAKE_CUDA_ARCHITECTURES=60-virtual;61-virtual;70-virtual;75-virtual;80-virtual;86-real;89-real;90-virtual' `
            '-DGGML_CUDA_CCCL_VERSION=v3.4.3' `
            '-DGGML_CUDA_NCCL=OFF' `
            '-DLLAMA_BUILD_TESTS=OFF' `
            '-DLLAMA_BUILD_TOOLS=ON' `
            '-DLLAMA_BUILD_SERVER=ON' `
            '-DLLAMA_BUILD_EXAMPLES=OFF' `
            '-DLLAMA_BUILD_APP=OFF' `
            '-DLLAMA_BUILD_BORINGSSL=ON' `
            '-DLLAMA_OPENSSL=OFF'

      - name: Build
        shell: pwsh
        run: |
          # Build all enabled targets so dynamic backend MODULEs (ggml-cuda.dll, ggml-cpu-*.dll)
          # are compiled alongside llama-cli.exe and llama-server.exe.
          cmake --build build --config Release --parallel

      - name: Package and smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dist = Join-Path $PWD "dist\llama-windows-x64-cuda12.4"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          # Include executables, DLLs, and dynamically loaded GGML backends.
          Copy-Item -Path "build\bin\Release\*" -Destination $dist -Recurse -Force
          Copy-Item -Path "llama.cpp\LICENSE" -Destination $dist -Force

          # Verify essential binaries and dynamic backends were produced.
          $requiredBuiltFiles = @(
            "llama-cli.exe",
            "llama-server.exe",
            "ggml-cuda.dll"
          )
          foreach ($file in $requiredBuiltFiles) {
            $builtPath = Join-Path $dist $file
            if (-not (Test-Path $builtPath)) {
              throw "Required build artifact missing: $builtPath"
            }
          }

          # Remove any intermediate .lib, .exp, or .pdb files so the distribution stays clean.
          Get-ChildItem -Path $dist -Include *.lib, *.exp, *.pdb -Recurse | Remove-Item -Force -ErrorAction SilentlyContinue

          # CUDA 12 runtime DLLs needed by ggml-cuda.
          $cudaBin = Join-Path $env:CUDA_PATH "bin"
          $runtimeDlls = @(
            "cudart64_12.dll",
            "cublas64_12.dll",
            "cublasLt64_12.dll"
          )
          foreach ($dll in $runtimeDlls) {
            $source = Join-Path $cudaBin $dll
            if (-not (Test-Path $source)) {
              throw "Required CUDA runtime DLL not found: $source"
            }
            Copy-Item -Path $source -Destination $dist -Force
          }

          @"
          llama.cpp ref: $env:LLAMA_REF
          llama.cpp commit: $env:LLAMA_COMMIT
          backend: CUDA
          CUDA version: 12.4
          architecture: Windows x64
          "@ | Set-Content -Path (Join-Path $dist "BUILD.txt") -Encoding utf8

          # Test the packaged executables with the packaged CUDA DLLs on PATH.
          $env:PATH = "$dist;$env:PATH"
          & (Join-Path $dist "llama-cli.exe") --version
          if ($LASTEXITCODE -ne 0) { throw "llama-cli smoke test failed" }
          & (Join-Path $dist "llama-server.exe") --version
          if ($LASTEXITCODE -ne 0) { throw "llama-server smoke test failed" }

          # Create exactly one ZIP archive. Upload-artifact is configured below
          # to upload this file as-is rather than wrapping it in another ZIP.
          $archive = Join-Path $env:GITHUB_WORKSPACE "llama-windows-x64-cuda12.4.zip"
          if (Test-Path $archive) { Remove-Item $archive -Force }
          Push-Location $dist
          try {
            & 7z a -tzip -mx=9 -snl $archive ".\*"
            if ($LASTEXITCODE -ne 0) { throw "7z packaging failed" }
            & 7z t $archive
            if ($LASTEXITCODE -ne 0) { throw "ZIP archive validation failed" }
          }
          finally {
            Pop-Location
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: llama-windows-x64-cuda12.4.zip
          path: llama-windows-x64-cuda12.4.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

  # ==========================================================
  # Linux x64 CUDA 12.4
  # ==========================================================
  linux-cuda:
    name: Linux x64 CUDA 12.4
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout llama.cpp
        uses: actions/checkout@v6
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ inputs.llama_ref || 'master' }}
          path: llama.cpp
          fetch-depth: 1

      - name: Record llama.cpp commit
        shell: bash
        env:
          LLAMA_REF_INPUT: ${{ inputs.llama_ref || 'master' }}
        run: |
          COMMIT="$(git -C llama.cpp rev-parse HEAD)"
          echo "LLAMA_COMMIT=$COMMIT" >> "$GITHUB_ENV"
          echo "LLAMA_REF=$LLAMA_REF_INPUT" >> "$GITHUB_ENV"
          echo "llama.cpp ref: $LLAMA_REF_INPUT"
          echo "llama.cpp commit: $COMMIT"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # Do not apt-install cmake; GitHub runners already include CMake >= 3.31 in /usr/local/bin
          sudo apt-get install -y build-essential ninja-build ccache libssl-dev p7zip-full

      - name: Install CUDA 12.4
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.4.1"
          method: network
          subpackages: "cuda-compiler-12-4,cuda-cudart-dev-12-4,libcublas-dev-12-4"

      - name: Verify build environment
        run: |
          nvcc --version
          gcc --version
          cmake --version
          ninja --version
          echo "CUDA_PATH=$CUDA_PATH"

      - name: Configure CMake
        run: |
          # lightning-indexer instantiates half dequantizers; FP16_AVAILABLE starts at sm_60.
          cmake \
            -S llama.cpp \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_BACKEND_DL=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU=ON \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DGGML_CUDA=ON \
            -DCMAKE_CUDA_ARCHITECTURES="60-virtual;61-virtual;70-virtual;75-virtual;80-virtual;86-real;89-real;90-virtual" \
            -DGGML_CUDA_CCCL_VERSION="v3.4.3" \
            -DGGML_CUDA_NCCL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_APP=OFF

      - name: Build
        run: |
          # Build all enabled targets so libggml-cuda.so and libggml-cpu-*.so dynamic backends are built.
          cmake --build build --config Release --parallel

      - name: Package and smoke test
        shell: bash
        run: |
          set -euo pipefail

          DIST="dist/llama-linux-x64-cuda12.4"
          mkdir -p "$DIST"

          # Copy executables, shared libraries, and dynamically loaded backends.
          cp -a build/bin/. "$DIST/"
          cp llama.cpp/LICENSE "$DIST/"

          # Verify essential binaries and dynamic backends were produced.
          for file in llama-cli llama-server libggml-cuda.so; do
            if [[ ! -e "$DIST/$file" ]]; then
              echo "Required build artifact missing: $DIST/$file" >&2
              exit 1
            fi
          done

          # Bundle the CUDA runtime libraries required by ggml-cuda.
          CUDA_ROOT="${CUDA_PATH:-$(dirname "$(dirname "$(readlink -f "$(command -v nvcc)")")")}"
          CUDA_LIB_DIR="$CUDA_ROOT/lib64"
          for lib in libcudart.so.12 libcublas.so.12 libcublasLt.so.12; do
            source="$CUDA_LIB_DIR/$lib"
            if [[ ! -e "$source" ]]; then
              echo "Required CUDA runtime library not found: $source" >&2
              exit 1
            fi
            cp -L "$source" "$DIST/$lib"
          done

          cat > "$DIST/BUILD.txt" <<EOF
          llama.cpp ref: $LLAMA_REF
          llama.cpp commit: $LLAMA_COMMIT
          backend: CUDA
          CUDA version: 12.4
          architecture: Linux x64
          EOF

          # Test the packaged binaries with the bundled CUDA runtime libraries.
          export LD_LIBRARY_PATH="$PWD/$DIST${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          "$DIST/llama-cli" --version
          "$DIST/llama-server" --version

          # Match the Windows package format and avoid a nested artifact ZIP.
          ARCHIVE="$GITHUB_WORKSPACE/llama-linux-x64-cuda12.4.zip"
          rm -f "$ARCHIVE"
          (cd "$DIST" && 7z a -tzip -mx=9 -snl "$ARCHIVE" .)
          7z t "$ARCHIVE"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: llama-linux-x64-cuda12.4.zip
          path: llama-linux-x64-cuda12.4.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
