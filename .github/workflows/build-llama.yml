name: Build llama.cpp (CUDA 12.4)

on:
  workflow_dispatch:
    inputs:
      llama_ref:
        description: "llama.cpp branch, tag, or commit"
        required: false
        default: "master"

permissions:
  contents: read

env:
  LLAMA_REPO: "https://github.com/ggml-org/llama.cpp.git"
  LLAMA_REF: master

jobs:

  # ==========================================================
  # Windows x64 CUDA 12.4
  # ==========================================================
  windows-cuda:
    name: Windows x64 CUDA 12.4
    runs-on: windows-2022

    steps:
      - name: Clone llama.cpp
        shell: pwsh
        run: |
          $ref = "${{ github.event.inputs.llama_ref || env.LLAMA_REF }}"
          git clone --depth 1 --branch "$ref" "$env:LLAMA_REPO" llama.cpp
          $commit = git -C llama.cpp rev-parse HEAD
          "LLAMA_COMMIT=$commit" >> $env:GITHUB_ENV
          Write-Host "llama.cpp commit: $commit"

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CUDA 12.4
        uses: ./llama.cpp/.github/actions/windows-setup-cuda
        with:
          cuda_version: "12.4"
          cuda_arch: "x64"

      - name: Install Ninja
        shell: pwsh
        run: |
          choco install ninja -y

      - name: Verify Environment
        shell: pwsh
        run: |
          cl.exe
          nvcc --version
          Write-Host "CUDA_PATH=$env:CUDA_PATH"

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake `
            -S llama.cpp `
            -B build `
            -G "Ninja Multi-Config" `
            -DGGML_BACKEND_DL=ON `
            -DBUILD_SHARED_LIBS=ON `
            -DGGML_NATIVE=OFF `
            -DGGML_CPU=ON `
            -DGGML_CUDA=ON `
            -DGGML_CUDA_CUB_3DOT2=ON `
            -DLLAMA_BUILD_TESTS=OFF `
            -DLLAMA_BUILD_EXAMPLES=ON

      - name: Build
        shell: pwsh
        run: |
          cmake `
            --build build `
            --config Release `
            --parallel `
            --target llama-cli llama-server

      - name: Smoke test
        shell: pwsh
        run: |
          .\build\bin\Release\llama-cli.exe --version
          .\build\bin\Release\llama-server.exe --version

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\llama-windows-x64-cuda12.4

          # Copy built binaries and shared libraries
          Copy-Item build\bin\Release\* dist\llama-windows-x64-cuda12.4\ -Recurse -Force
          Copy-Item llama.cpp\LICENSE dist\llama-windows-x64-cuda12.4\

          # Copy essential CUDA runtime DLLs
          if (Test-Path "$env:CUDA_PATH\bin") {
            Copy-Item "$env:CUDA_PATH\bin\cudart64_12*.dll" dist\llama-windows-x64-cuda12.4\ -ErrorAction SilentlyContinue
            Copy-Item "$env:CUDA_PATH\bin\cublas64_12*.dll" dist\llama-windows-x64-cuda12.4\ -ErrorAction SilentlyContinue
            Copy-Item "$env:CUDA_PATH\bin\cublasLt64_12*.dll" dist\llama-windows-x64-cuda12.4\ -ErrorAction SilentlyContinue
          }

          Set-Content dist\llama-windows-x64-cuda12.4\BUILD.txt @"
          llama.cpp commit: $env:LLAMA_COMMIT
          backend: CUDA
          CUDA version: 12.4
          architecture: Windows x64
          "@

          7z a llama-windows-x64-cuda12.4.zip .\dist\llama-windows-x64-cuda12.4\*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-windows-x64-cuda12.4
          path: llama-windows-x64-cuda12.4.zip


  # ==========================================================
  # Linux x64 CUDA 12.4
  # ==========================================================
  linux-cuda:
    name: Linux x64 CUDA 12.4
    runs-on: ubuntu-22.04

    steps:
      - name: Clone llama.cpp
        run: |
          REF="${{ github.event.inputs.llama_ref || env.LLAMA_REF }}"
          git clone --depth 1 --branch "$REF" "$LLAMA_REPO" llama.cpp
          COMMIT=$(git -C llama.cpp rev-parse HEAD)
          echo "LLAMA_COMMIT=$COMMIT" >> $GITHUB_ENV
          echo "llama.cpp commit: $COMMIT"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build ccache

      - name: Install CUDA 12.4
        uses: Jimver/cuda-toolkit@v0.2.22
        with:
          cuda: '12.4.1'
          method: 'network'

      - name: Verify Environment
        run: |
          nvcc --version
          which gcc
          echo "CUDA_PATH=$CUDA_PATH"

      - name: Configure CMake
        run: |
          cmake \
            -S llama.cpp \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_BACKEND_DL=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU=ON \
            -DGGML_CUDA=ON \
            -DGGML_CUDA_CUB_3DOT2=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=ON

      - name: Build
        run: |
          cmake \
            --build build \
            --config Release \
            --parallel \
            --target llama-cli llama-server

      - name: Smoke test
        run: |
          ./build/bin/llama-cli --version
          ./build/bin/llama-server --version

      - name: Package
        run: |
          mkdir -p dist/llama-linux-x64-cuda12.4
          cp -r build/bin/* dist/llama-linux-x64-cuda12.4/
          cp llama.cpp/LICENSE dist/llama-linux-x64-cuda12.4/

          cat <<EOF > dist/llama-linux-x64-cuda12.4/BUILD.txt
          llama.cpp commit: $LLAMA_COMMIT
          backend: CUDA
          CUDA version: 12.4
          architecture: Linux x64
          EOF

          tar -czf llama-linux-x64-cuda12.4.tar.gz -C dist/llama-linux-x64-cuda12.4 .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-linux-x64-cuda12.4
          path: llama-linux-x64-cuda12.4.tar.gz
